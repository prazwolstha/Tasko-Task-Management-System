<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account/TasKo </title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="png" href="tasko.png">

    <style>
        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
           
        }

        .container{
            width:420px;
            background:#fff;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        .container h2{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#444;
        }

        .input-box input,
        .input-box select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            font-size:15px;
            transition:0.3s;
        }

        .input-box input:focus,
        .input-box select:focus{
            border-color:#11998e;
            box-shadow:0 0 5px rgba(17,153,142,0.5);
        }

        .terms{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:20px;
            font-size:14px;
            color:#444;
        }

        .terms input{
            width:auto;
        }

        .terms a{
            text-decoration:none;
            color:#11998e;
            font-weight:bold;
        }

        .terms a:hover{
            text-decoration:underline;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#11998e;
            color:#fff;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        .btn:hover{
            background:#0b7d74;
            font-size:17px;
            padding:14px;
        }

        .back-btn{
            background:#555;
        }

        .back-btn:hover{
            background:#333;
            font-size:17px;
            padding:14px;
        }

        .login-link{
            text-align:center;
            margin-top:20px;
            font-size:14px;
        }

        .login-link a{
            text-decoration:none;
            color:#11998e;
            font-weight:bold;
        }

        .login-link a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Create Account</h2>

        <form action="register.php" method="POST">

            <div class="input-box">
                <label>Enter Full Name</label>
                <input type="text"  name="full_name" placeholder="Enter Full Name" required>
            </div>

            <div class="input-box">
                <label>Enter Email</label>
                <input type="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="input-box">
                <label>Enter Password</label>
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <div class="input-box">
                <label>Select Role</label>

                <select name="role" required>
                    <option value="">-- Select Role --</option>
                    <option value="user">User Register</option>
                    <option value="admin">Admin Register</option>
                </select>
            </div>
            <input type="submit" name="create" value="create" class="btn">
        </form>
            

            <button type="button" class="btn back-btn">
                <a href="home.html " style="color:#fff; text-decoration: none;">Back</a>
            </button>

            <div class="login-link">
                Already have an Account?
                <a href="login.html">Login here</a>
            </div>


    </div>

</body>
</html>
