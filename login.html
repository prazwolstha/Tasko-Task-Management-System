<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
     <link rel="stylesheet" href="style.css">
    <link rel="icon" type="png" href="tasko.png">


    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            
        }

        .container{
            width:400px;
            background:#fff;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.3);
        }

        .container h2{
            text-align:center;
            margin-bottom:30px;
            color:#333;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#444;
        }

        .input-box input,
        .input-box select{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            outline:none;
            transition:0.3s;
            font-size:15px;
        }
        
        .input-box input:focus,
        .input-box select:focus{
            border-color:#2a5298;
            box-shadow:0 0 5px rgba(42,82,152,0.5);
        }

        .options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
            font-size:14px;
        }

        .options a{
            text-decoration:none;
            color:#2a5298;
            font-weight:bold;
        }

        .options a:hover{
            text-decoration:underline;
        }

        .btn{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#000000;
            color:#fff;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
            margin-bottom:15px;
        }

        .btn:hover{
            background:#000000;
            font-size:17px;
            padding:14px;
        }

        .register{
            text-align:center;
            font-size:14px;
            margin-top:10px;
        }

        .register a{
            text-decoration:none;
            color:#2a5298;
            font-weight:bold;
        }

        .register a:hover{
            text-decoration:underline;
        }

        .back-btn{
            background:#555;
        }

        .back-btn:hover{
            background:#333;
        }

    </style>
</head>

<body>

    <div class="container">

        <h2>Login Page</h2>

        <form action="login.php" method="POST">

            <div class="input-box">
                <label>Enter Email</label>
                <input type="email" name="email" placeholder="example@gmail.com" required>
            </div>

            <div class="input-box">
                <label>Enter Password</label>
                <input type="password" name="password" placeholder="Enter Password" required>
            </div>

            <div class="input-box">
                <label>Select Role</label>

                <select name="role" required>
                    <option value="">-- Select Role --</option>
                    <option value="user">User Login</option>
                    <option value="admin">Admin Login</option>
                </select>
            </div>

            <div class="options">
                <a href="#">Forgot Password?</a>
            </div>

            <input type="submit" name="login" value="login" class="btn">

             <button type="button" class="btn back-btn">
                <a href="home.html " style="color:#fff; text-decoration: none;">Back</a>
            </button>

            <div class="register">
                Don't have an Account?
                <a href="register.html">Register here</a>
            </div>

        </form>

    </div>

</body>
</html>
